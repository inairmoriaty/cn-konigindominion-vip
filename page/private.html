<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KÖNIGIN - Private</title>
  <link rel="stylesheet" href="../style/private.css">
  
  <style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* 滚轮参数 */
  --item-h: 46px;         /* 单项高度（iOS感） */
  --visible: 7;           /* 可视条数（奇数，让中心高亮条两边各有 3 行） */
  --wheel-h: calc(var(--item-h) * var(--visible));
}

html, body {
  margin: 0; padding: 0;
  width: 100vw; min-height: 100vh;
  background: #191919; 
  overflow-x: hidden; 
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.app-frame {
  width: 100%; height: 100vh; max-width: 1440px;
  position: relative; margin: 0 auto; border-radius: 0; overflow: hidden;
  box-shadow: none; background: #191919;
  padding-top: var(--safe-top);
  top: 0; left: 0; right: 0; bottom: 0; box-sizing: border-box;
}

.private-bg {
  position: absolute; inset: 0;
  background: url('../img/private.png') center / cover no-repeat;
  z-index: 1;
}
.private-title {
  position: absolute; top: -3%; left: 50%; transform: translateX(-50%);
  width: 750px; height: 300px;
  background: url('../svg/private/door brand.svg') center/contain no-repeat;
  z-index: 2; pointer-events: none;
}

/* —— iOS 风格滚轮 —— */
.guest-wheel {
  position: absolute;
  left: 53%;
  transform: translateX(-50%);
  top: 30%;
  width: 200px;                 /* 滚轮宽度 */
  height: var(--wheel-h);       /* 固定可视高度（5行） */
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr 14px;  /* 列表 + 细滚条 */
  gap: 8px;
}
.wheel-viewport {
  position: relative;
  height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;      /* 防止触发页面滚动 */
  scroll-snap-type: y mandatory;     /* CSS 原生吸附 —— 顺滑 */
  scroll-behavior: smooth;
  scrollbar-width: none;
  -ms-overflow-style: none;
  touch-action: pan-y;               /* 明确只接管竖向滑动 */
  will-change: scroll-position;
}
.wheel-viewport::-webkit-scrollbar { display: none; }

/* 渐隐遮罩（上下淡出） */
.wheel-viewport::before,
.wheel-viewport::after {
  content: "";
  position: sticky;
  display: block;
  left: 0; right: 0;
  height: calc((var(--wheel-h) - var(--item-h)) / 2);
  z-index: 2; pointer-events: none;
}
.wheel-viewport::before { top: 0; background: linear-gradient(to bottom, rgba(25,25,25,1), rgba(25,25,25,0)); }
.wheel-viewport::after  { bottom: 0; background: linear-gradient(to top, rgba(25,25,25,1), rgba(25,25,25,0)); }

/* 中间高亮选择条 */
.wheel-highlight {
  position: absolute;
  left: 0; right: 14px;  /* 让出右侧细滚条 */
  top: 50%;
  transform: translateY(calc(-50% + 1px));
  height: var(--item-h);
  border-radius: 12px;
  z-index: 3; pointer-events: none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -2px 4px rgba(0,0,0,.35);
  border: 1px solid #69696955;
  background: linear-gradient(180deg, rgba(90,90,90,.15) 0%, rgba(65,65,65,.1) 100%);
}

/* 列表项 */
.wheel-list { position: relative; }
.wheel-item {
  height: var(--item-h);
  display:flex; align-items:center; justify-content:center;
  color:#bfbfbf; font-size:15px; letter-spacing:.06em;
  user-select:none; cursor:pointer;
  scroll-snap-align: center;
  scroll-snap-stop: always;            /* 滚动时每一格都吸附，不连跳 */
  opacity: .55;
  transform: scale(.94);
  transition: transform .22s cubic-bezier(.22,.9,.32,1),
              color .22s ease,
              opacity .22s ease;
  will-change: transform, opacity;
}
.wheel-item.dist-1 { opacity: .78; transform: scale(.98); color: #e0e0e0; }
.wheel-item.is-center {
  transform: scale(1.12);
  color: #fff;
  font-weight: 600;
  opacity: 1;
  letter-spacing: .1em;
}

/* 右侧自定义细滚条（同步视觉，不可拖拽；空闲时淡出） */
.guest-scrollbar{
  position: relative; width: 4px; height: 100%;
  opacity: .35;
  transition: opacity .3s ease, width .25s ease;
}
.guest-scrollbar.is-active { opacity: 1; width: 6px; }
.guest-scrollbar .track{
  position: absolute; inset: 0; background: rgba(255,255,255,.08); border-radius: 3px;
}
.guest-scrollbar .thumb{
  position: absolute; left: 0; right: 0; height: 40px;
  background: rgba(255,255,255,.55); border-radius: 3px;
  will-change: top, height;
}

/* 门透明热点 */
.door-hotspot{
  position: absolute; left: 50%; top: 55%;
  transform: translateX(-50%);
  width: 22%; height: 20%;
  z-index: 6; cursor: pointer; background: transparent;
}

/* 其他 */
.nav-circle-btn { position: absolute; z-index: 10; display: block; }
  </style>
</head>
<body>
  <div class="page-container">
  <div class="app-frame">
    <div class="private-bg"></div>

    <!-- 门的透明互动区域：点击跳转到密码页 -->

    <!-- iOS 风格无限滚轮 -->
    <div class="guest-wheel" id="guestWheel">
      <div class="wheel-viewport" id="wheelViewport" aria-label="Guests Picker">
        <div class="wheel-highlight"></div>
        <div class="wheel-list" id="wheelList">
          <!-- 初始内容仅用于提供数据，渲染时会重建 -->
          <div class="wheel-item" data-link="../locked_files/201.html">麦香鱼</div>
          <div class="wheel-item" data-link="../locked_files/202.html">燕麦</div>
          <div class="wheel-item" data-link="../locked_files/203.html">十七</div>

          <div class="wheel-item" data-link="../locked_files/215.html">明灭</div>
          <div class="wheel-item" data-link="../locked_files/216.html">冷面</div>
          <div class="wheel-item" data-link="../locked_files/217.html">夜鸦</div>
          <div class="wheel-item" data-link="../locked_files/218.html">塑料</div>
          <div class="wheel-item" data-link="../locked_files/219.html">星辰</div>
          <div class="wheel-item" data-link="../locked_files/220.html">执</div>
          <div class="wheel-item" data-link="../locked_files/221.html">赵客</div>
          <div class="wheel-item" data-link="../locked_files/222.html">猩猩狗</div>
          <div class="wheel-item" data-link="../locked_files/223.html">姬芜追</div>
          <div class="wheel-item" data-link="../locked_files/224.html">小安</div>

          <div class="wheel-item" data-link="../locked_files/227.html">莱尔</div>
          <div class="wheel-item" data-link="../locked_files/228.html">阿年/渔火</div>

        </div>
      </div>
      <div class="guest-scrollbar" id="guestScrollbar">
        <div class="track"></div>
        <div class="thumb" id="guestThumb"></div>
      </div>
    </div>

    </div>
  </div>
  <!-- Footer自动插入点 -->

  <script>
/* —— 门热点 —— */
(function(){
  const door = document.getElementById('doorHotspot');
  if (!door) return;
  door.addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = '../locked_files/master.html';
  });
})();

/* —— 顺滑 iOS 风格无限滚轮 ——
   原则：
   1) 用 CSS `scroll-snap-type: y mandatory` 做吸附，JS 不再干扰滚动。
   2) 滚动中只在 rAF 里更新视觉（高亮 / thumb），不改 scrollTop。
   3) 无限回环只在滚动空闲时静默跳帧，用户永远感知不到。
   4) 支持 滚轮 / 触控 / 键盘 ↑↓ / PageUp/Down / 回车 四种输入。
*/
(function(){
  const viewport = document.getElementById('wheelViewport');
  const listEl   = document.getElementById('wheelList');
  const thumb    = document.getElementById('guestThumb');
  const barEl    = document.getElementById('guestScrollbar');

  if (!viewport || !listEl || !thumb || !barEl) return;

  // ---------- 1. 构建数据 ----------
  const baseItems = Array.from(listEl.querySelectorAll('.wheel-item')).map(n => ({
    text: n.textContent.trim(),
    link: n.getAttribute('data-link') || '#'
  }));
  const N = baseItems.length;

  // 复制 3 份用于无限回环（上 / 中 / 下）
  listEl.innerHTML = '';
  const COPIES = 3;
  const frag = document.createDocumentFragment();
  for (let c = 0; c < COPIES; c++){
    baseItems.forEach((it) => {
      const div = document.createElement('div');
      div.className = 'wheel-item';
      div.textContent = it.text;
      div.dataset.link = it.link;
      frag.appendChild(div);
    });
  }
  listEl.appendChild(frag);
  const allItems = Array.from(listEl.children);
  const total    = allItems.length;

  const css = getComputedStyle(document.documentElement);
  const ITEM_H  = parseFloat(css.getPropertyValue('--item-h')) || 46;
  const VISIBLE = parseInt(css.getPropertyValue('--visible'))  || 7;
  const CENTER_OFFSET = Math.floor(VISIBLE / 2);

  // 初始位置：定位到第二份首项，两侧都有 1 份缓冲
  viewport.scrollTop = N * ITEM_H;

  // ---------- 2. 工具函数 ----------
  // 当前视口中心在 allItems 里的下标（含余数）
  function currentCenterRawIndex(){
    const raw = viewport.scrollTop / ITEM_H + CENTER_OFFSET;
    return Math.round(raw);
  }
  // 映射到原始 0..N-1 下标
  function toBaseIndex(rawIdx){
    return ((rawIdx % N) + N) % N;
  }

  // 更新高亮 + dist-1 柔和过渡（只在中心变化时写 DOM）
  let lastCenterRaw = -1;
  function updateHighlight(){
    const c = currentCenterRawIndex();
    if (c === lastCenterRaw) return;
    lastCenterRaw = c;
    for (let i = 0; i < total; i++){
      const el = allItems[i];
      const d = Math.abs(i - c);
      el.classList.toggle('is-center', d === 0);
      el.classList.toggle('dist-1',    d === 1);
    }
  }

  // 自定义小滚条（每份 N 项作为可视范围，循环时视觉重置）
  function updateThumb(){
    const perCopyH = ITEM_H * N;
    const trackH   = barEl.clientHeight;
    const viewH    = viewport.clientHeight;
    const thumbH   = Math.max(28, Math.round(viewH * viewH / perCopyH));
    const maxTop   = Math.max(trackH - thumbH, 0);
    // 用在「单份」里的相对位置映射到小滚条上
    const relTop   = ((viewport.scrollTop - N * ITEM_H) % perCopyH + perCopyH) % perCopyH;
    thumb.style.height = thumbH + 'px';
    thumb.style.top    = (relTop / Math.max(perCopyH - viewH, 1) * maxTop) + 'px';
  }

  // ---------- 3. 空闲时才做无限回环 ----------
  function loopGuardIdle(){
    const min = ITEM_H * (N * 0.5);
    const max = ITEM_H * (N * COPIES - N * 0.5);
    if (viewport.scrollTop < min){
      viewport.scrollTop += ITEM_H * N;
    } else if (viewport.scrollTop > max){
      viewport.scrollTop -= ITEM_H * N;
    }
  }

  // ---------- 4. 滚动节流（rAF）+ 空闲检测 ----------
  let ticking = false;
  let scrollEndTimer = null;
  function onScroll(){
    if (!ticking){
      ticking = true;
      requestAnimationFrame(() => {
        updateHighlight();
        updateThumb();
        ticking = false;
      });
    }
    barEl.classList.add('is-active');

    // 用 scrollend 的 polyfill：200ms 无事件视为停止
    clearTimeout(scrollEndTimer);
    scrollEndTimer = setTimeout(onScrollEnd, 200);
  }
  function onScrollEnd(){
    loopGuardIdle();
    updateHighlight();
    updateThumb();
    barEl.classList.remove('is-active');
  }
  viewport.addEventListener('scroll', onScroll, { passive: true });

  // ---------- 5. 点击某项：平滑滚到中心，再跳转 ----------
  function smoothScrollTo(targetTop, cb){
    viewport.scrollTo({ top: targetTop, behavior: 'smooth' });
    if (cb){
      // 等 scrollend 或 350ms 兜底
      const fallback = setTimeout(done, 380);
      const handler = () => { clearTimeout(fallback); done(); };
      viewport.addEventListener('scrollend', handler, { once: true });
      function done(){ cb(); }
    }
  }

  listEl.addEventListener('click', (e) => {
    const item = e.target.closest('.wheel-item');
    if (!item) return;
    const idx = allItems.indexOf(item);
    const centerIdx = currentCenterRawIndex();
    const link = item.dataset.link || '#';

    if (idx === centerIdx){
      if (link && link !== '#') window.location.href = link;
    } else {
      const targetTop = (idx - CENTER_OFFSET) * ITEM_H;
      smoothScrollTo(targetTop, () => {
        if (link && link !== '#') window.location.href = link;
      });
    }
  });

  // ---------- 6. 鼠标滚轮：每 tick 走一格 ----------
  let wheelLock = false;
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    const dir  = e.deltaY > 0 ? 1 : -1;
    const next = Math.round(viewport.scrollTop / ITEM_H) + dir;
    viewport.scrollTo({ top: next * ITEM_H, behavior: 'smooth' });
    setTimeout(() => { wheelLock = false; }, 140);
  }, { passive: false });

  // ---------- 7. 键盘支持 ----------
  viewport.tabIndex = 0;
  viewport.addEventListener('keydown', (e) => {
    const step = { ArrowUp: -1, ArrowDown: 1, PageUp: -VISIBLE, PageDown: VISIBLE }[e.key];
    if (step != null){
      e.preventDefault();
      const next = Math.round(viewport.scrollTop / ITEM_H) + step;
      viewport.scrollTo({ top: next * ITEM_H, behavior: 'smooth' });
    } else if (e.key === 'Enter'){
      e.preventDefault();
      const centerItem = allItems[currentCenterRawIndex()];
      const link = centerItem?.dataset.link;
      if (link && link !== '#') window.location.href = link;
    }
  });

  // ---------- 8. 初始化视觉 ----------
  requestAnimationFrame(() => {
    updateHighlight();
    updateThumb();
  });
})();
  </script>
<script src="../js/swipe-back.js"></script>
